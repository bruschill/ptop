name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Git ref used as the changed-file formatting base
        required: false
        default: HEAD^

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      format: ${{ steps.filter.outputs.format }}
      platform: ${{ steps.filter.outputs.platform }}
      legacy: ${{ steps.filter.outputs.legacy }}
      pi_parser: ${{ steps.filter.outputs.pi_parser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            format:
              - '**/*.rs'
              - 'scripts/check-rustfmt.sh'
              - '.github/workflows/ci.yml'
            platform:
              - '**/*.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'clippy.toml'
              - 'scripts/ptop-statusline.sh'
              - 'README.md'
              - 'docs/pi-support.md'
              - '.github/workflows/ci.yml'
            legacy:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'src/app.rs'
              - 'src/collector/**'
              - 'src/config.rs'
              - 'src/demo.rs'
              - 'src/host_info.rs'
              - 'src/lib.rs'
              - 'src/model/**'
              - 'src/snapshot.rs'
              - 'src/theme/**'
              - '.github/workflows/ci.yml'
            pi_parser:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'src/collector/mod.rs'
              - 'src/collector/pi.rs'
              - 'src/collector/pi_subagents.rs'
              - 'src/collector/process.rs'
              - 'src/model/**'
              - '.github/workflows/ci.yml'

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.format == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Check changed Rust files
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          MANUAL_BASE_REF: ${{ inputs.base_ref }}
        run: |
          base_sha="${PR_BASE_SHA:-${PUSH_BASE_SHA:-${MANUAL_BASE_REF:-HEAD^}}}"
          if [[ "${base_sha}" =~ ^0+$ ]]; then base_sha=HEAD^; fi
          scripts/check-rustfmt.sh "${base_sha}"

  platform:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.platform == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows process-only
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings -A clippy::uninlined-format-args
      - run: cargo test --all-targets
      - run: cargo build --release

  legacy-regression:
    name: Legacy collector regression
    needs: changes
    if: needs.changes.outputs.legacy == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test collector::tests::with_hidden
      - run: cargo test product_entry_uses_pi_collector_unless_legacy_is_requested
      - run: cargo test snapshot::tests::to_snapshot_maps_fields_and_passes_interval_through

  pi-parser-budget:
    name: Pi parser budget
    needs: changes
    if: needs.changes.outputs.pi_parser == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release pi_parser_release_benchmark -- --ignored --nocapture
